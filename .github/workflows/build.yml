name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk MangaViewer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MangaViewer-apk
          path: MangaViewer.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" MangaViewer.apk \
            --title "まんがビューワー build ${{ github.run_number }}" \
            --notes "スマホで MangaViewer.apk をダウンロードしてインストールしてください。" \
            --latest
