plugins {
    id 'com.android.application'
}

def bn = Integer.parseInt((project.findProperty('buildNumber') ?: '1').toString())

android {
    namespace 'jp.mangaviewer.app'
    compileSdk 34

    defaultConfig {
        applicationId "jp.mangaviewer.app"
        minSdk 23
        targetSdk 34
        versionCode bn
        versionName "1." + bn
    }
    signingConfigs {
        debug {
            storeFile file('mangaviewer.keystore')
            storePassword 'mangaviewer'
            keyAlias 'mv'
            keyPassword 'mangaviewer'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
